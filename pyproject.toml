[project]
name = "kronos-mcp"
version = "0.1.0"
description = "MCP server para mantenimiento de un Korg Kronos vía MIDI SysEx"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kronos-mcp = "kronos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronos_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
